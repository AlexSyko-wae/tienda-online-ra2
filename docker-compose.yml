services:
  db:
    image: mysql:8
    environment:
      MYSQL_DATABASE: ${DB_NAME:?Define DB_NAME en .env}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en .env}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - app_net

  backend:
    build: .
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Define DJANGO_SECRET_KEY en .env}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      DB_ENGINE: mysql
      DB_NAME: ${DB_NAME:?Define DB_NAME en .env}
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en .env}
      DB_HOST: db
      DB_PORT: 3306
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    networks:
      - app_net

  frontend:
    build: ./frontend
    environment:
      VITE_BASE_API_URL: http://localhost:8000
    depends_on:
      - backend
    ports:
      - "5173:5173"
    networks:
      - app_net

volumes:
  mysql_data:

networks:
  app_net:
    driver: bridge
